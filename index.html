<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CodeMentor — Programming Learning Assistant</title>
<style>
  :root {
    --bg: #1e1e2e;
    --panel: #181825;
    --titlebar: #11111b;
    --editor: #1e1e2e;
    --line: #313244;
    --blue: #89b4fa;
    --orange: #fab387;
    --green: #a6e3a1;
    --red: #f38ba8;
    --purple: #cba6f7;
    --text: #cdd6f4;
    --text-dim: #7f849c;
    --user-bubble: linear-gradient(135deg, #89b4fa, #74c7ec);
    --bot-bubble: #232336;
    --radius: 10px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Fira Code', 'Consolas', 'Courier New', monospace;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  .app {
    width: 100%;
    max-width: 580px;
    height: 90vh;
    max-height: 780px;
    background: var(--panel);
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.55);
    border: 1px solid var(--line);
  }

  .titlebar {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: var(--titlebar);
    border-bottom: 1px solid var(--line);
  }

  .dots { display: flex; gap: 7px; }
  .dot { width: 11px; height: 11px; border-radius: 50%; }
  .dot.red { background: var(--red); }
  .dot.orange { background: var(--orange); }
  .dot.green { background: var(--green); }

  .filename {
    margin-left: 6px;
    font-size: 12.5px;
    color: var(--text-dim);
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 16px 20px;
    background: var(--editor);
    border-bottom: 1px solid var(--line);
  }

  .logo {
    width: 40px;
    height: 40px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }

  header h1 {
    font-size: 16px;
    margin: 0;
    color: var(--text);
  }

  header p {
    margin: 2px 0 0;
    font-size: 11.5px;
    color: var(--text-dim);
  }

  .status-dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--green);
    margin-left: auto;
    box-shadow: 0 0 8px var(--green);
  }

  #chat-window {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    background: var(--editor);
  }

  #chat-window::-webkit-scrollbar { width: 6px; }
  #chat-window::-webkit-scrollbar-thumb {
    background: var(--line);
    border-radius: 8px;
  }

  .msg {
    max-width: 82%;
    padding: 12px 15px;
    border-radius: var(--radius);
    font-size: 13.5px;
    line-height: 1.6;
    white-space: pre-wrap;
    animation: fadein 0.2s ease;
  }

  @keyframes fadein {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg.bot {
    align-self: flex-start;
    background: var(--bot-bubble);
    border: 1px solid var(--line);
    border-bottom-left-radius: 3px;
    color: var(--text);
  }

  .msg.bot::before {
    content: "// CodeMentor";
    display: block;
    color: var(--green);
    font-size: 10.5px;
    margin-bottom: 6px;
  }

  .msg.user {
    align-self: flex-end;
    background: var(--user-bubble);
    border-bottom-right-radius: 3px;
    color: #11111b;
    font-weight: 600;
  }

  .typing {
    align-self: flex-start;
    display: flex;
    gap: 5px;
    padding: 14px 16px;
    background: var(--bot-bubble);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    border-bottom-left-radius: 3px;
  }

  .typing span {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--blue);
    animation: blink 1.2s infinite;
  }

  .typing span:nth-child(2) { animation-delay: 0.2s; }
  .typing span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes blink {
    0%, 80%, 100% { opacity: 0.2; }
    40% { opacity: 1; }
  }

  form#chat-form {
    display: flex;
    gap: 10px;
    padding: 14px 16px;
    background: var(--titlebar);
    border-top: 1px solid var(--line);
  }

  .prompt-symbol {
    display: flex;
    align-items: center;
    color: var(--green);
    font-size: 15px;
    padding-left: 2px;
  }

  #user-input {
    flex: 1;
    padding: 12px 15px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: var(--editor);
    color: var(--text);
    font-family: inherit;
    font-size: 13.5px;
    outline: none;
    resize: none;
  }

  #user-input:focus {
    border-color: var(--blue);
  }

  #send-btn {
    width: 46px;
    height: 46px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: #11111b;
    font-size: 16px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
    flex-shrink: 0;
  }

  #send-btn:hover { transform: scale(1.06); }
  #send-btn:active { transform: scale(0.94); }

  .disclaimer {
    text-align: center;
    font-size: 10.5px;
    color: var(--text-dim);
    padding: 6px 16px 12px;
    background: var(--titlebar);
  }
</style>
</head>
<body>

  <div class="app">
    <div class="titlebar">
      <div class="dots">
        <span class="dot red"></span>
        <span class="dot orange"></span>
        <span class="dot green"></span>
      </div>
      <span class="filename">codementor.py</span>
    </div>

    <header>
      <div class="logo">💻</div>
      <div>
        <h1>CodeMentor</h1>
        <p>Programming Learning Assistant</p>
      </div>
      <div class="status-dot"></div>
    </header>

    <div id="chat-window">
      <div class="msg bot">Hi, I'm CodeMentor 💻 Ask me anything about learning to code — concepts, syntax, debugging, or examples in any language.</div>
    </div>

    <form id="chat-form">
      <div class="prompt-symbol">&gt;</div>
      <textarea id="user-input" rows="1" placeholder="Ask a programming question..." autocomplete="off"></textarea>
      <button type="submit" id="send-btn">➤</button>
    </form>
    <div class="disclaimer">CodeMentor only answers programming learning questions.</div>
  </div>

<script>
  const chatWindow = document.getElementById('chat-window');
  const form = document.getElementById('chat-form');
  const input = document.getElementById('user-input');

  function addMessage(text, sender) {
    const div = document.createElement('div');
    div.className = 'msg ' + sender;
    div.textContent = text;
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
    return div;
  }

  function showTyping() {
    const div = document.createElement('div');
    div.className = 'typing';
    div.id = 'typing-indicator';
    div.innerHTML = '<span></span><span></span><span></span>';
    chatWindow.appendChild(div);
    chatWindow.scrollTop = chatWindow.scrollHeight;
  }

  function hideTyping() {
    const el = document.getElementById('typing-indicator');
    if (el) el.remove();
  }

  async function sendMessage(message) {
    showTyping();
    try {
      const res = await fetch('/chat', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ message })
      });
      const data = await res.json();
      hideTyping();
      addMessage(data.reply || "Sorry, something went wrong.", 'bot');
    } catch (err) {
      hideTyping();
      addMessage("Network error. Please check your connection and try again.", 'bot');
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    addMessage(text, 'user');
    input.value = '';
    input.style.height = 'auto';
    sendMessage(text);
  });

  // Enter to send, Shift+Enter for new line
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      form.requestSubmit();
    }
  });

  // Auto-resize textarea
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 120) + 'px';
  });
</script>

</body>
</html>
